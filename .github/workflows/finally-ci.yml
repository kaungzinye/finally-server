name: Finally CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: finally-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  finally:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install Mage
        run: go install github.com/magefile/mage@v1.17.2
      - name: Build
        run: mage build
      - name: Finally tests
        run: mage test:filter 'TestFinally'
