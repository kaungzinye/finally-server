name: Finally Server bug report
description: Report a reproducible problem in this fork
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues first. Report vulnerabilities through [SECURITY.md](https://github.com/kaungzinye/finally-server/blob/main/SECURITY.md), not in a public issue. General Vikunja bugs belong in the upstream project.

  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Finally task API
        - Calendar context
        - Authentication or authorization
        - Deployment configuration
        - Finally client compatibility
        - Documentation
        - Other fork-specific code
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: State the expected and actual result.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Use a minimal test account and remove all private data.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: main @ abc1234
    validations:
      required: true

  - type: input
    id: deployment
    attributes:
      label: Deployment and database
      placeholder: Docker, PostgreSQL
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove tokens, credentials, task content, event content, email addresses, and private hostnames.

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched this fork and upstream Vikunja for the problem.
          required: true
        - label: This report contains no secret or private user data.
          required: true
