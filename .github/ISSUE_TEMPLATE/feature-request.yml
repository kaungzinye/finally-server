name: Finally Server feature request
description: Propose a fork-specific capability
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Explain why this belongs in Finally Server instead of upstream Vikunja.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the user or operator problem.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Include API, authorization, configuration, and data-retention effects.
    validations:
      required: true

  - type: textarea
    id: upstream
    attributes:
      label: Upstream relationship
      description: Explain whether the change applies to Vikunja in general and link related upstream work.
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched this fork and upstream Vikunja for related work.
          required: true
        - label: I can help test or implement this proposal.
          required: false
